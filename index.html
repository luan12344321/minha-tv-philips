<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha TV — teste</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}header{padding:35px 6%;font-size:28px;font-weight:bold}header span{color:#72b6ff}.hero{margin:0 6%;padding:55px 5%;background:linear-gradient(110deg,#19375c,#15172d);border-radius:22px}.hero h1{font-size:52px;margin:0 0 12px}.hero p{font-size:23px;color:#cbd5e1}h2{margin:35px 6% 18px}.apps{display:flex;gap:20px;margin:0 6%;flex-wrap:wrap}.app{display:flex;align-items:center;justify-content:center;width:210px;height:120px;border-radius:16px;background:#202b43;color:white;text-decoration:none;font-size:24px;font-weight:bold;border:4px solid transparent}.app:focus,.app.active{outline:none;border-color:#ffcc42;background:#344a6b;transform:scale(1.04)}.hint{margin:30px 6%;color:#cbd5e1;font-size:19px}#status{color:#ffdf80}
</style></head><body><header>MINHA <span>TV</span> <small style="font-size:15px;color:#aab7ce">PROTÓTIPO 01</small></header><section class="hero"><h1>Sua TV, do seu jeito.</h1><p>Teste de navegação com o controle remoto da Philips</p></section><h2>Seus aplicativos</h2><nav class="apps"><a class="app" href="#netflix" data-name="Netflix">NETFLIX</a><a class="app" href="#prime" data-name="Prime Video">prime video</a><a class="app" href="#disney" data-name="Disney+">Disney+</a><a class="app" href="#youtube" data-name="YouTube">YouTube</a></nav><p class="hint">Use as setas e aperte OK. <span id="status">Selecione um aplicativo para testar.</span></p><script>
(function(){var a=document.querySelectorAll('.app'),i=0,s=document.getElementById('status');function focus(n){i=(n+a.length)%a.length;for(var j=0;j<a.length;j++)a[j].className='app'+(j===i?' active':'');a[i].focus()}for(var j=0;j<a.length;j++){(function(k){a[k].onclick=function(e){e.preventDefault();focus(k);s.innerHTML='OK funcionou: '+a[k].getAttribute('data-name')+' (apenas demonstração).';};})(j)}document.onkeydown=function(e){var k=e.keyCode;if(k===37||k===38){focus(i-1);e.preventDefault()}else if(k===39||k===40){focus(i+1);e.preventDefault()}else if(k===13){a[i].click();e.preventDefault()}};focus(0)})();
</script></body></html>
